[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GuGa"
dynamic = ["version"]
description = "Linux to Android notification bridge."
readme = "README.md"
authors = [
    { name = "PositiveMatician", email = "amitbasuri8@gmail.com" }
]
requires-python = ">=3.7"
dependencies = [
    "quart",
    "python-socketio",
    "uvicorn",
    "gunicorn",
    "python-dotenv",
    "qrcode",
    "cryptography",
    "aiohttp",
    "requests",
    "pexpect",
    "mcp",
    "PyJWT",
    "argcomplete",
    "filelock>=3.12.0"
]

[project.scripts]
guga = "guga.cli:main"

[project.urls]
"Homepage" = "https://github.com/PositiveMatician/GuGa-Nexus"
"Repository" = "https://github.com/PositiveMatician/GuGa-Nexus"

[tool.setuptools.dynamic]
version = {attr = "guga.__version__"}
