[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GuGa"
version = "1.0.3"
description = "Linux to Android notification bridge."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "flask",
    "flask-socketio",
    "eventlet",
    "gunicorn",
    "python-dotenv",
    "qrcode",
    "cryptography",
    "aiohttp"
]

[project.scripts]
guga = "guga.cli:main"
