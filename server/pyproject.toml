[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GuGa"
version = "1.0.9"
description = "Linux to Android notification bridge."
readme = "README.md"
authors = [
    { name = "PositiveMatician", email = "amitbasuri8@gmail.com" }
]
requires-python = ">=3.7"
dependencies = [
    "flask",
    "flask-socketio",
    "eventlet",
    "gunicorn",
    "python-dotenv",
    "qrcode",
    "cryptography",
    "aiohttp"
]

[project.scripts]
guga = "guga.cli:main"

[project.urls]
"Homepage" = "https://github.com/PositiveMatician/GuGa-Nexus"
"Repository" = "https://github.com/PositiveMatician/GuGa-Nexus"
