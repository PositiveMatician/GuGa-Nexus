<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GuGa</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/PositiveMatician/GuGa-Nexus/latest/app-stable/app/src/main/assets/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            overscroll-behavior: none;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        .shell {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* ── Header ── */
        .hdr {
            flex-shrink: 0;
            padding: 24px 22px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            background: #111;
            border-radius: 999px;
            padding: 7px 14px 7px 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #555;
            letter-spacing: 0.03em;
            transition: color 0.3s;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #333;
            flex-shrink: 0;
            transition: background 0.3s;
        }

        .dot.online  { background: #fff; animation: blink 2.5s ease-in-out infinite; }
        .dot.waiting { background: #666; animation: blink 1s ease-in-out infinite; }
        .dot.error   { background: #555; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        /* ── Feed ── */
        .feed {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 18px 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .feed::-webkit-scrollbar { display: none; }

        /* ── Bubbles ── */
        .bubble {
            max-width: 82%;
            padding: 10px 16px;
            border-radius: 22px;
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.45;
            animation: pop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            word-break: break-word;
        }

        @keyframes pop {
            from { opacity: 0; transform: scale(0.85); }
            to   { opacity: 1; transform: scale(1); }
        }

        .bubble.sys {
            align-self: center;
            background: transparent;
            color: #333;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: pre-wrap;
            padding: 2px 0;
            max-width: 100%;
            text-align: center;
            animation: none;
        }

        .bubble.title {
            align-self: flex-start;
            background: transparent;
            color: #555;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 0 0 2px 4px;
            margin-bottom: -4px;
            max-width: 100%;
            animation: none;
        }

        .bubble.bot {
            align-self: flex-start;
            background: #fff;
            color: #000;
            border-bottom-left-radius: 6px;
        }

        .bubble.usr {
            align-self: flex-end;
            background: #1a1a1a;
            color: #fff;
            border-bottom-right-radius: 6px;
        }



        /* ── Input Row ── */
        .input-row {
            flex-shrink: 0;
            padding: 10px 16px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #cmdInput {
            flex: 1;
            background: #111;
            border: none;
            border-radius: 999px;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 600;
            padding: 13px 20px;
            outline: none;
            -webkit-appearance: none;
            transition: background 0.2s;
        }

        #cmdInput::placeholder {
            color: #333;
            font-weight: 600;
        }

        #cmdInput:focus {
            background: #141414;
        }

        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: #fff;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.12s, background 0.15s;
            -webkit-appearance: none;
        }

        .send-btn:active {
            transform: scale(0.88);
            background: #ddd;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            stroke: #000;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 400px) {
            .hdr { padding: 18px 16px 12px; }
            .feed { padding: 6px 14px 4px; }
            .input-row { padding: 8px 12px 14px; }
        }

        /* ── Reply UI ── */
        .bubble-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 2px;
        }
        .bubble-wrap.usr { flex-direction: row-reverse; }

        .reply-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            opacity: 0;
            transition: opacity 0.2s, transform 0.1s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .bubble-wrap:hover .reply-btn { opacity: 0.4; }
        .reply-btn:hover { opacity: 1 !important; background: rgba(255,255,255,0.05); }
        .reply-btn svg { 
            width: 18px; 
            height: 18px; 
            fill: none; 
            stroke: #666; 
            stroke-width: 2.5; 
            stroke-linecap: round; 
            stroke-linejoin: round; 
        }

        .reply-bar {
            background: #080808;
            padding: 10px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #666;
            border-top: 1px solid #111;
            animation: slideUp 0.2s ease-out;
        }
        .reply-bar.active { display: flex; }
        .reply-bar .txt { 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            max-width: 80%;
            font-weight: 600;
        }
        .reply-bar .close { 
            cursor: pointer; 
            padding: 4px 8px; 
            font-size: 1.1rem; 
            color: #333; 
            transition: color 0.2s;
        }
        .reply-bar .close:hover { color: #fff; }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="shell">

    <div class="hdr">
        <div class="logo">guga.</div>
        <div class="status-pill">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">starting up</span>
        </div>
    </div>

    <div class="feed" id="feed"></div>



    <div class="reply-bar" id="replyBar">
        <div class="txt" id="replyText">Replying to message...</div>
        <div class="close" onclick="cancelReply()">✕</div>
    </div>

    <div class="input-row">
        <input
            type="text"
            id="cmdInput"
            placeholder="say something..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            inputmode="text"
            onkeydown="onKey(event)"
        />
        <button class="send-btn" onclick="sendCommand()">
            <svg viewBox="0 0 18 18">
                <line x1="2" y1="9" x2="16" y2="9"/>
                <polyline points="10,3 16,9 10,15"/>
            </svg>
        </button>
    </div>

</div>
<script>
    let deviceId = localStorage.getItem('guga_device_id');
    if (!deviceId) {
        deviceId = 'browser-' + Math.random().toString(36).substring(2, 15);
        localStorage.setItem('guga_device_id', deviceId);
    }

    let token = localStorage.getItem('guga_token');
    let socket = null;

    // Request browser notification permissions
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    const feed      = document.getElementById('feed');
    const statusDot = document.getElementById('statusDot');
    const statusTxt = document.getElementById('statusText');

    function setStatus(label, state) {
        statusTxt.textContent = label;
        statusDot.className = 'dot ' + (state || '');
    }

    function addBubble(cls, text, msgId) {
        let sysEl = document.getElementById('sysMessage');

        if (cls === 'sys') {
            if (!sysEl) {
                sysEl = document.createElement('div');
                sysEl.id = 'sysMessage';
                sysEl.className = 'bubble sys';
                feed.appendChild(sysEl);
            } else {
                feed.appendChild(sysEl);
            }
            sysEl.textContent = text;
            feed.scrollTo({ top: feed.scrollHeight, behavior: 'smooth' });
            return;
        }

        const isMsg = (cls === 'bot' || cls === 'usr');
        let elToInsert = null;
        
        if (isMsg && msgId) {
            const wrap = document.createElement('div');
            wrap.className = 'bubble-wrap ' + (cls === 'usr' ? 'usr' : '');
            
            const div = document.createElement('div');
            div.className = 'bubble ' + cls;
            div.textContent = text;
            
            const btn = document.createElement('button');
            btn.className = 'reply-btn';
            btn.title = 'Reply';
            btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 14L4 9L9 4"/><path d="M20 20C20 16.134 16.866 13 13 13H4"/></svg>`;
            btn.onclick = () => initiateReply(msgId, text);
            
            wrap.appendChild(div);
            wrap.appendChild(btn);
            elToInsert = wrap;
        } else {
            const div = document.createElement('div');
            div.className = 'bubble ' + cls;
            div.textContent = text;
            elToInsert = div;
        }

        if (sysEl) {
            feed.insertBefore(elToInsert, sysEl);
        } else {
            feed.appendChild(elToInsert);
        }
        
        feed.scrollTo({ top: feed.scrollHeight, behavior: 'smooth' });
    }

    function addNotification(title, message, msgId) {
        if (title) {
            addBubble('title', title);
        }
        addBubble('bot', message, msgId);

        // Show a native browser notification if permissions are granted and the tab is hidden
        if ('Notification' in window) {
            if (Notification.permission === 'granted' && document.hidden) {
                const notif = new Notification(title || 'GuGa', {
                    body: message,
                    icon: 'https://raw.githubusercontent.com/PositiveMatician/GuGa-Nexus/latest/app-stable/app/src/main/assets/logo.png'
                });
                notif.onclick = () => {
                    window.focus();
                    notif.close();
                };
            }
        }
    }

    let currentReplyId = null;

    function initiateReply(id, text) {
        currentReplyId = id;
        document.getElementById('replyBar').classList.add('active');
        document.getElementById('replyText').textContent = 'Replying to: ' + text;
        const input = document.getElementById('cmdInput');
        input.focus();
    }

    function cancelReply() {
        currentReplyId = null;
        document.getElementById('replyBar').classList.remove('active');
    }

    function onKey(e) { if (e.key === 'Enter') sendCommand(); }

    async function initAuth() {
        setStatus('connecting...', 'waiting');
        try {
            // Generate a random 8-digit PIN locally
            const pin = Array.from({length: 8}, () => Math.floor(Math.random() * 10)).join('');
            
            const helloRes = await fetch('/api/hello', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    device_id: deviceId, 
                    pin: pin,
                    device_name: navigator.userAgent.includes("Firefox") ? "Firefox" : 
                                 navigator.userAgent.includes("Chrome") ? "Chrome" : "Browser"
                })
            });
            const helloData = await helloRes.json();

            if (helloData.status === 'pin_required') {
                addBubble('sys', 'Your PIN: ' + pin.split('').join(' ') + '\nRun `guga --approve` on your Linux machine');
                
                // Poll for approval
                let attempts = 0;
                const pollInterval = setInterval(async () => {
                    attempts++;
                    if (attempts > 60) { // 5 minutes (5s * 60)
                        clearInterval(pollInterval);
                        setStatus('expired', 'error');
                        addBubble('sys', 'Pairing request expired.');
                        return;
                    }
                    
                    try {
                        const verifyRes = await fetch('/api/verify_pin', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ device_id: deviceId, pin: pin, client_type: 'browser' })
                        });
                        const verifyData = await verifyRes.json();
                        
                        if (verifyData.status === 'paired') {
                            clearInterval(pollInterval);
                            token = verifyData.token;
                            localStorage.setItem('guga_token', token);
                            addBubble('sys', 'paired ✓');
                            connectSocket();
                        } else if (verifyRes.status === 401 && verifyData.error === "too many attempts") {
                            clearInterval(pollInterval);
                            setStatus('blocked', 'error');
                            addBubble('sys', 'Too many failed attempts.');
                        }
                    } catch (e) {}
                }, 5000);
                
                setStatus('waiting for approval...', 'waiting');
                return;
            }
            connectSocket();
        } catch (e) {
            setStatus('error', 'error');
            addBubble('sys', String(e));
        }
    }

    let lastRequestId = null;

    function connectSocket() {
        let shownDisconnect = false;

        socket = io({
            query: { device_id: deviceId, token: token },
            transports: ['websocket', 'polling']
        });

        socket.on('connect', () => {
            shownDisconnect = false;
            setStatus('online', 'online');
            addBubble('sys', 'connected');
        });

        socket.on('disconnect', () => {
            if (!shownDisconnect) {
                shownDisconnect = true;
                setStatus('offline', 'error');
                addBubble('sys', 'disconnected');
            }
        });

        socket.on('guga_response', (data) => {
            if (data.title || data.message) {
                const msg = data.message || 'encrypted payload';
                // Only show ID in debug or if needed, but pass it to the UI
                addNotification(data.title, msg, data.unique_message_id);
            }
        });

        socket.on('guga_ask', (data) => {
            lastRequestId = data.request_id;
            const msg = data.message || 'Question';
            const idSuffix = data.request_id ? ` [req: ${data.request_id}]` : '';
            addNotification(data.title || "Question", msg + idSuffix);
        });

        socket.on('connect_error', (err) => {
            if (err.message.includes('rejected')) {
                localStorage.removeItem('guga_token');
                setStatus('auth revoked', 'error');
                if (!shownDisconnect) {
                    shownDisconnect = true;
                    addBubble('sys', 'token revoked — refresh to re-pair');
                }
            } else if (!shownDisconnect) {
                shownDisconnect = true;
                setStatus('offline', 'error');
                addBubble('sys', 'disconnected');
            }
        });
    }

    function sendCommand() {
        // Request permissions here since it is triggered by user interaction
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
        const input = document.getElementById('cmdInput');
        let text = input.value.trim();
        if (!text || !socket) return;
        
        let payload = { phrase: text, device_id: deviceId };
        
        // Support explicit request targeting via "req:id:message"
        // Use "req:null:message" to bypass interactive blocks
        if (text.startsWith('req:')) {
            const parts = text.split(':');
            if (parts.length >= 3) {
                const reqId = parts[1].trim();
                payload.request_id = (reqId === 'null' || reqId === 'none') ? null : reqId;
                payload.phrase = parts.slice(2).join(':').trim();
                text = `[${reqId}] ${payload.phrase}`;
            }
        }

        addBubble('usr', text);
        
        // Attach request_id if we are in reply mode
        if (currentReplyId) {
            payload.request_id = currentReplyId;
            cancelReply(); // Reset UI after sending
        }

        socket.emit('command', payload);
        input.value = '';
        feed.scrollTo({ top: feed.scrollHeight, behavior: 'smooth' });
    }

    initAuth();
</script>
</body>
</html>
